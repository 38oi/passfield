  <meta name="theme-color" content="#13140f">
  <title>passfield</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%2313140f' width='32' height='32' rx='8'/%3E%3Ccircle cx='10' cy='16' r='3' fill='%23d6e36a'/%3E%3Ccircle cx='22' cy='10' r='3' fill='%231f8a78'/%3E%3Ccircle cx='22' cy='22' r='3' fill='%23c4476c'/%3E%3C/svg%3E">
  <script>
    (function () {
      var theme = null;
      try { theme = localStorage.getItem("pole.theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark" && theme !== "custom") {
        theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.dataset.theme = theme;
      if (theme === "custom") {
        try {
          var custom = JSON.parse(localStorage.getItem("pole.themeCustom") || "null");
          if (custom && typeof custom === "object") {
            var root = document.documentElement.style;
            var hex = function (value, fallback) {
              return typeof value === "string" && /^#[0-9a-fA-F]{6}$/.test(value) ? value : fallback;
            };
            var ink = hex(custom.ink, "#f3efe4");
            var accent = hex(custom.accent, "#d6e36a");
            var toRgb = function (h) {
              return {
                r: parseInt(h.slice(1, 3), 16),
                g: parseInt(h.slice(3, 5), 16),
                b: parseInt(h.slice(5, 7), 16)
              };
            };
            var rgba = function (h, a) {
              var c = toRgb(h);
              return "rgba(" + c.r + ", " + c.g + ", " + c.b + ", " + a + ")";
            };
            root.setProperty("--bg", hex(custom.bg, "#13140f"));
            root.setProperty("--bg-2", hex(custom.bg2, "#1a1b15"));
            root.setProperty("--card", hex(custom.card, "#23241c"));
            root.setProperty("--ink", ink);
            root.setProperty("--muted", hex(custom.muted, "#a39e90"));
            root.setProperty("--accent", accent);
            root.setProperty("--accent-ink", hex(custom.accentInk, "#1a1c10"));
            root.setProperty("--danger", hex(custom.danger, "#e07a6a"));
            root.setProperty("--menu", hex(custom.menu, "#2c2d24"));
            root.setProperty("--line", rgba(ink, 0.12));
            root.setProperty("--wire", rgba(accent, 0.55));
            root.setProperty("--grid-dot", rgba(ink, 0.22));
            root.setProperty("--secret", rgba(ink, 0.07));
            root.setProperty("--hover", rgba(ink, 0.06));
          }
        } catch (e) {}
      }
      var mode = null;
      try { mode = localStorage.getItem("pole.mode"); } catch (e) {}
      document.documentElement.dataset.mode = mode === "notes" ? "notes" : "pass";
    })();
  </script>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

  <header class="top">
    <div class="brand">
      <span class="mark">passfield</span>
      <div class="modes" role="tablist">
        <button type="button" id="mode-pass" data-mode="pass">
          <svg class="ico" aria-hidden="true"><use href="#key-round"></use></svg>
          <span>Пароли</span>
        </button>
        <button type="button" id="mode-notes" data-mode="notes">
          <svg class="ico" aria-hidden="true"><use href="#book-open"></use></svg>
          <span>Заметки</span>
        </button>
      </div>
    </div>
    <div class="searchwrap">
      <svg class="search-ico ico" aria-hidden="true"><use href="#search"></use></svg>
      <input id="search" type="search" placeholder="Поиск по паролям и заметкам" autocomplete="off" spellcheck="false">
      <span id="searchcount"></span>
      <div id="searchhits" class="searchhits" hidden></div>
    </div>
    <div class="top-actions">
      <button id="trash-open" type="button" class="ghost-btn icon-btn" title="Корзина" aria-label="Корзина">
        <svg class="ico" aria-hidden="true"><use href="#trash-2"></use></svg>
        <span id="trash-badge" class="badge" hidden>0</span>
      </button>
      <button id="settings-open" type="button" class="ghost-btn icon-btn" title="Настройки" aria-label="Настройки">
        <svg class="ico" aria-hidden="true"><use href="#settings-2"></use></svg>
      </button>
    </div>
  </header>

  <div id="pass-shell">
    <nav class="tabs">
      <div id="tabbuttons"></div>
      <input id="tab-new" type="text" maxlength="40" placeholder="+ метка" autocomplete="off">
    </nav>
    <main id="viewport">
      <svg id="wires"></svg>
      <div id="world">
        <div id="labels"></div>
        <div id="cards"></div>
      </div>
      <div id="marquee" hidden></div>
      <div id="empty" class="empty" hidden>
        <p id="empty-title"></p>
        <p id="empty-sub" class="empty-sub"></p>
      </div>
      <div id="map-tools" class="map-tools">
        <button type="button" id="zoom-out" aria-label="Мельче"><svg class="ico" aria-hidden="true"><use href="#minus"></use></svg></button>
        <button type="button" id="zoom-in" aria-label="Крупнее"><svg class="ico" aria-hidden="true"><use href="#plus"></use></svg></button>
        <button type="button" id="zoom-fit" aria-label="В кадр"><svg class="ico" aria-hidden="true"><use href="#maximize-2"></use></svg></button>
      </div>
      <button type="button" id="map-add" class="fab" aria-label="Новый пароль"><svg class="ico" aria-hidden="true"><use href="#plus"></use></svg></button>
    </main>
  </div>

  <div id="notes-shell" hidden>
    <aside id="notes-side">
      <div class="notes-side-top">
        <button type="button" id="note-new" class="side-primary">
          <svg class="ico" aria-hidden="true"><use href="#file-text"></use></svg>
          <span>Новая статья</span>
        </button>
        <button type="button" id="note-new-folder" class="side-icon" title="Новая папка" aria-label="Новая папка">
          <svg class="ico" aria-hidden="true"><use href="#folder"></use></svg>
        </button>
        <button type="button" id="notes-side-close" class="side-icon notes-side-close" title="Закрыть список" aria-label="Закрыть список">
          <svg class="ico" aria-hidden="true"><use href="#x"></use></svg>
        </button>
      </div>
      <div id="notes-tree"></div>
      <div id="notes-root-drop" class="notes-root-drop">На верхний уровень</div>
    </aside>
    <section id="note-stage">
      <div class="notes-stage-bar">
        <button type="button" id="notes-menu" class="ghost-btn notes-menu-btn">
          <svg class="ico" aria-hidden="true"><use href="#book-open"></use></svg>
          <span>Список</span>
        </button>
      </div>
      <div id="note-empty" class="note-empty" hidden>
        <p class="note-empty-title">База знаний</p>
        <p class="note-empty-sub">Создайте статью — скрипты, деплой, инструкции.</p>
      </div>
      <div id="note-page" hidden>
        <input id="note-title" maxlength="200" autocomplete="off" spellcheck="true">
        <div id="note-folder-body" class="note-folder-body" hidden></div>
        <div id="note-tools" class="note-tools">
          <span id="note-save" class="note-save"></span>
          <button type="button" id="note-delete" class="danger">Удалить</button>
        </div>
        <div id="note-editor" class="note-editor"></div>
      </div>
    </section>
  </div>

  <div id="note-bubble" class="note-bubble" hidden>
    <button type="button" data-cmd="bold" title="Жирный"><b>Ж</b></button>
    <button type="button" data-cmd="italic" title="Курсив"><i>К</i></button>
    <button type="button" data-cmd="strike" title="Зачёркнутый"><s>S</s></button>
    <button type="button" data-cmd="link" title="Ссылка">↗</button>
    <button type="button" data-cmd="code" title="Блок кода">{ }</button>
  </div>

  <div id="scrim" class="scrim" hidden></div>

  <aside id="sheet" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <header class="sheet-head">
      <div>
        <div id="sheet-kicker" class="kicker"></div>
        <h2 id="sheet-name"></h2>
      </div>
      <button type="button" id="sheet-close" class="icon-btn sheet-close-btn" aria-label="Закрыть">
        <svg class="ico" aria-hidden="true"><use href="#x"></use></svg>
      </button>
    </header>
    <label class="field">
      <span>Имя на карте</span>
      <input id="f-title" maxlength="200" autocomplete="off" required>
    </label>
    <label class="field">
      <span>Логин</span>
      <input id="f-user" maxlength="200" autocomplete="off" spellcheck="false">
    </label>
    <label class="field">
      <span>Пароль</span>
      <input id="f-secret" maxlength="4000" autocomplete="off" spellcheck="false">
    </label>
    <label class="field">
      <span>Комментарий</span>
      <textarea id="f-comment" maxlength="2000" rows="3"></textarea>
    </label>
    <label class="field">
      <span>Адрес</span>
      <input id="f-url" maxlength="500" autocomplete="off" spellcheck="false">
    </label>
    <div class="field">
      <span>Тип</span>
      <div id="sheet-kinds" class="kinds"></div>
    </div>
    <div class="field">
      <span>Метки</span>
      <div id="sheet-tags" class="chips"></div>
      <input id="sheet-newtag" type="text" maxlength="40" autocomplete="off">
    </div>
    <section class="related-block">
      <h3>Связанные</h3>
      <div id="related"></div>
    </section>
    <p id="save-state" class="save-state"></p>
    <div class="dangerzone">
      <button type="button" id="delete">
        <svg class="ico" aria-hidden="true"><use href="#trash-2"></use></svg>
        <span>В корзину</span>
      </button>
      <div id="delete-confirm" hidden>
        <span>Переместить в корзину на 30 дней?</span>
        <button type="button" id="delete-yes">Да, в корзину</button>
        <button type="button" id="delete-no">Отмена</button>
      </div>
    </div>
  </aside>

  <div id="trash" class="trash" hidden>
    <div class="trash-card">
      <header class="trash-head">
        <div>
          <h2>Корзина</h2>
          <p>30 дней без изменений — затем удаление навсегда</p>
        </div>
        <button type="button" id="trash-close" class="ghost-btn icon-btn" aria-label="Закрыть">
          <svg class="ico" aria-hidden="true"><use href="#x"></use></svg>
        </button>
      </header>
      <div id="trash-list" class="trash-list"></div>
      <footer class="trash-foot">
        <button type="button" id="trash-empty" class="danger-quiet">
          <svg class="ico" aria-hidden="true"><use href="#trash-2"></use></svg>
          <span>Очистить корзину</span>
        </button>
      </footer>
    </div>
  </div>

  <div id="settings" class="settings" hidden>
    <div class="settings-card">
      <header class="settings-head">
        <div>
          <h2>Настройки</h2>
          <p>Внешний вид и палитра passfield</p>
        </div>
        <button type="button" id="settings-close" class="ghost-btn icon-btn" aria-label="Закрыть">
          <svg class="ico" aria-hidden="true"><use href="#x"></use></svg>
        </button>
      </header>
      <section class="settings-section">
        <h3>
          <svg class="ico" aria-hidden="true"><use href="#sun"></use></svg>
          Тема
        </h3>
        <div class="theme-picks">
          <button type="button" data-theme-pick="dark">
            <svg class="ico" aria-hidden="true"><use href="#moon"></use></svg>
            <span>Тёмная</span>
          </button>
          <button type="button" data-theme-pick="light">
            <svg class="ico" aria-hidden="true"><use href="#sun"></use></svg>
            <span>Светлая</span>
          </button>
          <button type="button" data-theme-pick="custom">
            <svg class="ico" aria-hidden="true"><use href="#palette"></use></svg>
            <span>Своя</span>
          </button>
        </div>
      </section>
      <section id="settings-colors" class="settings-section" hidden>
        <h3>
          <svg class="ico" aria-hidden="true"><use href="#palette"></use></svg>
          Цвета
        </h3>
        <div id="settings-color-rows" class="color-rows"></div>
        <button type="button" id="settings-reset" class="ghost-btn settings-reset">
          <svg class="ico" aria-hidden="true"><use href="#rotate-ccw"></use></svg>
          <span>Сбросить палитру</span>
        </button>
      </section>
    </div>
  </div>

  <div id="color-pop" class="color-pop" hidden>
    <div class="color-pop-top">
      <div id="color-preview" class="color-preview"></div>
      <input id="color-hex" maxlength="7" spellcheck="false" autocomplete="off">
    </div>
    <div id="color-board" class="color-board">
      <span id="color-board-knob" class="color-knob"></span>
    </div>
    <div id="color-hue" class="color-hue">
      <span id="color-hue-knob" class="color-knob hue"></span>
    </div>
    <div id="color-swatches" class="color-swatches"></div>
  </div>

  <div id="dialog" class="dialog" hidden>
    <div class="dialog-card">
      <h3 id="dialog-title"></h3>
      <p id="dialog-body"></p>
      <div class="dialog-actions">
        <button type="button" id="dialog-cancel">Отмена</button>
        <button type="button" id="dialog-ok" class="primary">Ок</button>
      </div>
    </div>
  </div>

  <div id="menu" class="menu" hidden>
    <button type="button" data-act="create">
      <svg class="ico" aria-hidden="true"><use href="#key-round"></use></svg>
      <span>Создать пароль здесь</span>
    </button>
    <button type="button" data-act="label">
      <svg class="ico" aria-hidden="true"><use href="#type"></use></svg>
      <span>Лейбл здесь</span>
    </button>
    <button type="button" data-act="select">
      <svg class="ico" aria-hidden="true"><use href="#square-dashed"></use></svg>
      <span>Выделить</span>
    </button>
  </div>

  <form id="composer" class="popover" hidden autocomplete="off">
    <label class="field">
      <span>Имя на карте</span>
      <input name="title" required maxlength="200" autocomplete="off">
    </label>
    <label class="field">
      <span>Пароль</span>
      <input name="secret" maxlength="4000" autocomplete="off" spellcheck="false">
    </label>
    <label class="field">
      <span>Логин</span>
      <input name="username" maxlength="200" autocomplete="off" spellcheck="false">
    </label>
    <label class="field">
      <span>Комментарий</span>
      <input name="comment" maxlength="2000" autocomplete="off">
    </label>
    <div class="field">
      <span>Тип</span>
      <div id="composer-kinds" class="kinds"></div>
    </div>
    <div class="field">
      <span>Метки</span>
      <div id="composer-tags" class="chips"></div>
      <input id="composer-newtag" type="text" maxlength="40" autocomplete="off">
    </div>
    <div class="popover-actions">
      <button type="submit" class="primary">Положить сюда</button>
      <button type="button" id="composer-cancel">Отмена</button>
    </div>
  </form>

  <div id="linkmenu" class="menu" hidden>
    <button type="button" id="unlink">Разорвать связь</button>
  </div>

  <div id="hint" class="hint" hidden></div>

  <div id="selectionbar" class="selectionbar" hidden>
    <span id="selcount"></span>
    <select id="seltag" aria-label="Поставить метку"></select>
    <button type="button" id="selclear">Снять</button>
  </div>

  <script src="/static/js/d3.min.js"></script>
  <script src="/static/js/icons.js"></script>
  <script src="/static/js/settings.js"></script>
  <script src="/static/js/trash.js"></script>
  <script src="/static/js/notes.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
